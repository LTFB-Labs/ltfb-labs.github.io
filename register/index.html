<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="la-root" content="../">
  <meta name="robots" content="noindex">
  <title>Регистрация · LevAcademy</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../core/core.css">
  <script type="module" src="../core/sign-in-page.js"></script>
</head>
<body data-mode="register">
  <header class="core-bar">
    <a class="core-brand" href="../"><img src="../img/logo.svg" alt="" width="36" height="36"><span>LevAcademy</span></a>
  </header>
  <main class="core-page core-narrow">
    <h1>Регистрация</h1>
    <p class="core-lead">Профилът е за родителя. Децата добавяш после.</p>
    <p class="core-note" id="invite-note" hidden>Поканен си в семейство в LevAcademy. Влез или се регистрирай и ще видиш децата.</p>

    <form class="core-card core-form" id="sign-in-form" hidden>
      <p class="core-note" id="local-note" hidden>Засега профилът и данните се пазят само в този браузър.</p>
      <label class="field">Имейл
        <input name="email" type="email" autocomplete="email" required>
      </label>
      <label class="field">Парола
        <span class="password-field">
          <input name="password" type="password" autocomplete="new-password" minlength="8" required>
          <button class="password-toggle" type="button" aria-label="Покажи паролата" aria-pressed="false">
            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.1 4M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </span>
        <span class="core-note">Поне 8 знака.</span>
      </label>
      <label class="field">Повтори паролата
        <span class="password-field">
          <input name="passwordRepeat" type="password" autocomplete="new-password" minlength="8" required>
          <button class="password-toggle" type="button" aria-label="Покажи паролата" aria-pressed="false">
            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.1 4M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </span>
      </label>
      <button class="button button-primary" type="submit">Регистрирай се</button>
    </form>

    <div class="core-card core-form" id="social-box" hidden>
      <button class="button" type="button" data-provider="google">Вход с Google</button>
      <button class="button" type="button" data-provider="facebook">Вход с Facebook</button>
    </div>

    <p class="core-notice" id="notice" role="status" hidden></p>
    <p class="core-error" id="error" role="alert" hidden></p>
    <p class="core-switch">Вече имаш профил? <a id="other-link" href="../login/">Влез</a></p>
  </main>
</body>
</html>
