<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="la-root" content="../../">
  <meta name="robots" content="noindex">
  <title>Вход · LevAcademy</title>
  <link rel="stylesheet" href="../../shared/tokens.css">
  <link rel="stylesheet" href="../../core/core.css">
  <script type="module">
    // Supabase returns here: Google/Facebook and e-mail links with ?code= (PKCE) or ?token_hash=&type=.
    // ?reset=1 (or type=recovery) is the „Забравена парола?“ link: the parent sets a new password first.
    // The indexeddb provider never needs this page.
    import { store } from '../../core/store.js';
    import { finishSignIn, showError } from '../../core/ui.js';

    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const reset = params.has('reset') || params.get('type') === 'recovery';

    async function finish() {
      const message = await finishSignIn(store);
      if (message) {
        $('status').hidden = true;
        showError($('error'), message);
        $('continue').hidden = false;
      }
    }

    try {
      if (store.provider === 'cloud') await store.completeSignIn();
      if (reset && store.provider === 'cloud') {
        $('status').hidden = true;
        const form = $('password-form');
        form.hidden = false;
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          try {
            await store.setNewPassword(new FormData(form).get('password'));
            form.hidden = true;
            $('status').hidden = false;
            await finish();
          } catch (e) {
            showError($('error'), e.message);
          }
        });
      } else {
        await finish();
      }
    } catch (e) {
      $('status').hidden = true;
      showError($('error'), e.message);
      $('retry').hidden = false;
    }
  </script>
</head>
<body>
  <header class="core-bar">
    <a class="core-brand" href="../../"><img src="../../img/logo.svg" alt="" width="36" height="36"><span>LevAcademy</span></a>
  </header>
  <main class="core-page core-narrow">
    <p class="core-lead" id="status">Влизаме…</p>
    <form class="core-card core-form" id="password-form" hidden>
      <h1>Нова парола</h1>
      <label class="field">Нова парола
        <input name="password" type="password" autocomplete="new-password" minlength="8" required>
        <span class="core-note">Поне 8 знака.</span>
      </label>
      <button class="button button-primary" type="submit">Запази паролата</button>
    </form>
    <p class="core-error" id="error" role="alert" hidden></p>
    <p id="continue" hidden><a class="button button-primary" href="../../app/">Продължи</a></p>
    <p id="retry" hidden><a class="button button-primary" href="../../login/">Към входа</a></p>
  </main>
</body>
</html>
